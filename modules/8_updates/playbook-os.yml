---
# Deploy OS auto-upgrade cron (AL2023, root). Stop nginx/php-fpm, dnf upgrade, reboot when updates apply.
#
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml --limit cccls
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml -e os_upgrade_remove_cron=true
#   After upgrade reboot: @reboot cron opens http/https on firewalld (or disables it when fail2ban is active).
#
- name: Deploy OS auto-upgrade tools (Amazon Linux 2023)
  hosts: all
  become: true
  gather_facts: true
  collections:
    - ansible.posix
  vars:
    os_upgrade_install_dir: /usr/local/bin
    os_upgrade_log_file: /var/log/os-upgrade.log
    os_upgrade_enable_cron: true
    os_upgrade_remove_cron: false
    os_upgrade_cron_tz: Australia/Sydney
    os_upgrade_cron_schedule: "0 0 */3 * *"
    os_upgrade_releasever: "auto"
    firewalld_boot_fix_enable_cron: true
    firewalld_boot_fix_remove_cron: false
    firewalld_boot_fix_delay: 90
    firewalld_boot_fix_log_file: /var/log/firewalld-boot-fix.log
  tags:
    - updates
    - os_upgrade

  tasks:
    - name: Skip OS upgrade on non-Amazon Linux 2023 hosts
      ansible.builtin.meta: end_host
      when: >
        ansible_distribution != "Amazon"
        or ansible_distribution_major_version | string != "2023"

    - name: Require dnf
      ansible.builtin.command:
        cmd: which dnf
      register: os_upgrade_dnf_check
      changed_when: false

    - name: Check active swap
      ansible.builtin.command: swapon --show
      register: os_upgrade_swap_status
      changed_when: false

    - name: Create 1G swap file when no swap active
      ansible.builtin.command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
      when: os_upgrade_swap_status.stdout | length == 0

    - name: Set permissions on swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
        owner: root
        group: root
      when: os_upgrade_swap_status.stdout | length == 0

    - name: Set up swap area
      ansible.builtin.command: mkswap /swapfile
      when: os_upgrade_swap_status.stdout | length == 0

    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      when: os_upgrade_swap_status.stdout | length == 0
      register: os_upgrade_swapon_result
      failed_when: >-
        os_upgrade_swapon_result.rc != 0
        and 'Device or resource busy' not in (os_upgrade_swapon_result.stderr | default(''))

    - name: Persist swap file in /etc/fstab
      ansible.builtin.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present
      when: os_upgrade_swap_status.stdout | length == 0

    - name: Deploy OS upgrade shell scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ os_upgrade_install_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh
        - fix-firewalld-after-boot.sh
        - install-firewalld-after-boot-cron.sh

    - name: Strip CRLF from OS upgrade scripts
      ansible.builtin.command:
        cmd: "sed -i 's/\\r$//' {{ os_upgrade_install_dir }}/{{ item }}"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh
        - fix-firewalld-after-boot.sh
        - install-firewalld-after-boot-cron.sh
      changed_when: false

    - name: Ensure OS upgrade log file
      ansible.builtin.file:
        path: "{{ os_upgrade_log_file }}"
        state: touch
        mode: "0644"

    - name: Ensure firewalld boot-fix log file
      ansible.builtin.file:
        path: "{{ firewalld_boot_fix_log_file }}"
        state: touch
        mode: "0644"

    - name: Remove firewalld after-boot cron
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/install-firewalld-after-boot-cron.sh --remove"
      when: firewalld_boot_fix_remove_cron | bool
      changed_when: true

    - name: Install firewalld after-boot cron (@reboot, post-OS-upgrade)
      ansible.builtin.command:
        cmd: >-
          {{ os_upgrade_install_dir }}/install-firewalld-after-boot-cron.sh
          --delay {{ firewalld_boot_fix_delay }}
          --wrapper {{ os_upgrade_install_dir }}/fix-firewalld-after-boot.sh
      when:
        - firewalld_boot_fix_enable_cron | bool
        - not (firewalld_boot_fix_remove_cron | bool)
      changed_when: true

    - name: Remove OS upgrade cron
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh --remove"
      when: os_upgrade_remove_cron | bool
      changed_when: true

    - name: Install OS upgrade cron (midnight every 3 days, Australia/Sydney)
      ansible.builtin.command:
        cmd: >-
          {{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh
          --tz {{ os_upgrade_cron_tz }}
          --schedule "{{ os_upgrade_cron_schedule }}"
          --releasever {{ os_upgrade_releasever }}
          --wrapper {{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh
      when:
        - os_upgrade_enable_cron | bool
        - not (os_upgrade_remove_cron | bool)
      changed_when: true

    - name: Fix firewalld after OS upgrades
      ansible.builtin.import_tasks: ../5_security/snippets/firewalld-http-https.yml

    - name: OS upgrade deployment summary
      ansible.builtin.debug:
        msg:
          - "Scripts: {{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh"
          - "Logs: {{ os_upgrade_log_file }}"
          - "Releasever: {{ os_upgrade_releasever }} (auto = latest AL2023 release at run time)"
          - "Cron enabled: {{ os_upgrade_enable_cron | bool }}"
          - "Schedule: {{ os_upgrade_cron_schedule }} ({{ os_upgrade_cron_tz }})"
          - "Flow: stop nginx + php-fpm -> dnf upgrade -> reboot -> @reboot firewalld fix"
          - "Swap: ensured 1G /swapfile when swapon --show is empty (persisted in fstab)"
          - "Firewalld boot cron: {{ firewalld_boot_fix_enable_cron | bool }} (delay {{ firewalld_boot_fix_delay }}s)"
          - "Firewalld boot log: {{ firewalld_boot_fix_log_file }}"
