---
# Deploy OS auto-upgrade cron (AL2023, root). Stop nginx/php-fpm, dnf upgrade, reboot when updates apply.
#
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml --limit cccls
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook-os.yml -e os_upgrade_remove_cron=true
#   Web ports only (no OS upgrade/journald/DNF): modules/8_updates/playbook-ensure-web-ports.yml
#   After upgrade reboot: @reboot cron + ensure-web-ports.timer open http/https
#   on firewalld (always). Fail2ban hosts then disable firewalld.
#
- name: Deploy OS auto-upgrade tools (Amazon Linux 2023)
  hosts: all
  become: true
  gather_facts: true
  vars:
    os_upgrade_install_dir: /usr/local/bin
    os_upgrade_log_file: /var/log/os-upgrade.log
    os_upgrade_enable_cron: true
    os_upgrade_remove_cron: false
    os_upgrade_cron_tz: Australia/Sydney
    os_upgrade_cron_schedule: "0 0 */3 * *"
    os_upgrade_releasever: "auto"
    firewalld_boot_fix_enable_cron: true
    firewalld_boot_fix_remove_cron: false
    firewalld_boot_fix_delay: 90
    firewalld_boot_fix_log_file: /var/log/firewalld-boot-fix.log
    journald_limit_enable: true
    journald_vacuum_on_deploy: true
    journald_system_max_use: 200M
    journald_vacuum_size: ""
    journald_vacuum_time: ""
    os_upgrade_clean_dnf_cache: true
  tags:
    - updates
    - os_upgrade

  tasks:
    - name: Skip OS upgrade on non-Amazon Linux 2023 hosts
      ansible.builtin.meta: end_host
      when: >
        ansible_distribution != "Amazon"
        or ansible_distribution_major_version | string != "2023"
      tags:
        - os_upgrade
        - firewalld_boot
        - journald_vacuum

    - name: Require dnf
      ansible.builtin.command:
        cmd: which dnf
      register: os_upgrade_dnf_check
      changed_when: false

    - name: Deploy systemd journal size limits
      ansible.builtin.copy:
        src: files/journald.conf
        dest: /etc/systemd/journald.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      when: journald_limit_enable | bool
      register: journald_conf_deploy
      notify: Restart systemd-journald
      tags:
        - os_upgrade
        - journald

    - name: Check for /swapfile (zram alone is too small for dnf on ~512MB hosts)
      ansible.builtin.stat:
        path: /swapfile
      register: os_upgrade_swapfile

    - name: Create 1G swap file when /swapfile is missing
      ansible.builtin.command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
      when: not os_upgrade_swapfile.stat.exists

    - name: Set permissions on swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
        owner: root
        group: root
      when: not os_upgrade_swapfile.stat.exists

    - name: Set up swap area
      ansible.builtin.command: mkswap /swapfile
      when: not os_upgrade_swapfile.stat.exists

    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      when: not os_upgrade_swapfile.stat.exists
      register: os_upgrade_swapon_result
      failed_when: >-
        os_upgrade_swapon_result.rc != 0
        and 'Device or resource busy' not in (os_upgrade_swapon_result.stderr | default(''))

    - name: Re-check swap file (may have been created above)
      ansible.builtin.stat:
        path: /swapfile
      register: os_upgrade_swapfile_final

    - name: Persist swap file in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile(\s|$)'
        line: '/swapfile none swap sw 0 0'
      when: os_upgrade_swapfile_final.stat.exists

    - name: Ensure swap file is active
      ansible.builtin.command: swapon /swapfile
      register: os_upgrade_swapon_ensure
      changed_when: os_upgrade_swapon_ensure.rc == 0
      failed_when: >-
        os_upgrade_swapon_ensure.rc != 0
        and 'Device or resource busy' not in (os_upgrade_swapon_ensure.stderr | default(''))
      when: os_upgrade_swapfile_final.stat.exists

    - name: Deploy OS upgrade shell scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ os_upgrade_install_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh
        - fix-firewalld-after-boot.sh
        - install-firewalld-after-boot-cron.sh
        - vacuum-journal.sh
      tags:
        - os_upgrade
        - journald_vacuum
        - firewalld_boot

    - name: Strip CRLF from OS upgrade scripts
      ansible.builtin.command:
        cmd: "sed -i 's/\\r$//' {{ os_upgrade_install_dir }}/{{ item }}"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh
        - fix-firewalld-after-boot.sh
        - install-firewalld-after-boot-cron.sh
        - vacuum-journal.sh
      changed_when: false
      tags:
        - os_upgrade
        - journald_vacuum
        - firewalld_boot

    - name: Ensure OS upgrade log file
      ansible.builtin.file:
        path: "{{ os_upgrade_log_file }}"
        state: touch
        mode: "0644"

    - name: Ensure firewalld boot-fix log file
      ansible.builtin.file:
        path: "{{ firewalld_boot_fix_log_file }}"
        state: touch
        mode: "0644"
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Deploy ensure-web-ports systemd unit
      ansible.builtin.copy:
        src: files/ensure-web-ports.service
        dest: /etc/systemd/system/ensure-web-ports.service
        owner: root
        group: root
        mode: "0644"
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Deploy ensure-web-ports systemd timer
      ansible.builtin.copy:
        src: files/ensure-web-ports.timer
        dest: /etc/systemd/system/ensure-web-ports.timer
        owner: root
        group: root
        mode: "0644"
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Ensure firewalld systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/firewalld.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Deploy firewalld ExecStartPost drop-in to open web ports
      ansible.builtin.copy:
        src: files/firewalld-open-web-ports.conf
        dest: /etc/systemd/system/firewalld.service.d/open-web-ports.conf
        owner: root
        group: root
        mode: "0644"
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Remove firewalld after-boot cron and systemd guards
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/install-firewalld-after-boot-cron.sh --remove"
      when: firewalld_boot_fix_remove_cron | bool
      changed_when: true
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Install firewalld after-boot cron (@reboot, post-OS-upgrade)
      ansible.builtin.command:
        argv:
          - "{{ os_upgrade_install_dir }}/install-firewalld-after-boot-cron.sh"
          - "--delay"
          - "{{ firewalld_boot_fix_delay }}"
          - "--wrapper"
          - "{{ os_upgrade_install_dir }}/fix-firewalld-after-boot.sh"
      when:
        - firewalld_boot_fix_enable_cron | bool
        - not (firewalld_boot_fix_remove_cron | bool)
      changed_when: true
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Enable ensure-web-ports timer
      ansible.builtin.systemd:
        name: ensure-web-ports.timer
        enabled: true
        state: started
        daemon_reload: true
      when:
        - firewalld_boot_fix_enable_cron | bool
        - not (firewalld_boot_fix_remove_cron | bool)
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Run ensure-web-ports once after deploy
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/fix-firewalld-after-boot.sh --ports-only"
      when:
        - firewalld_boot_fix_enable_cron | bool
        - not (firewalld_boot_fix_remove_cron | bool)
      changed_when: true
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Remove OS upgrade cron
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh --remove"
      when: os_upgrade_remove_cron | bool
      changed_when: true

    - name: Install OS upgrade cron (midnight every 3 days, Australia/Sydney)
      ansible.builtin.command:
        argv:
          - "{{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh"
          - "--tz"
          - "{{ os_upgrade_cron_tz }}"
          - "--schedule"
          - "{{ os_upgrade_cron_schedule }}"
          - "--releasever"
          - "{{ os_upgrade_releasever }}"
          - "--wrapper"
          - "{{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh"
      when:
        - os_upgrade_enable_cron | bool
        - not (os_upgrade_remove_cron | bool)
      changed_when: true

    - name: Fix firewalld after OS upgrades
      ansible.builtin.import_tasks: ../5_security/snippets/firewalld-http-https.yml
      tags:
        - os_upgrade
        - firewalld_boot

    - name: Clear DNF package cache
      ansible.builtin.command:
        cmd: dnf clean all
      when: os_upgrade_clean_dnf_cache | bool
      changed_when: true
      tags:
        - os_upgrade

    - name: Remove old systemd journal entries
      ansible.builtin.command:
        argv: "{{ journald_vacuum_cmd }}"
      vars:
        journald_vacuum_cmd: >-
          {{
            [os_upgrade_install_dir ~ '/vacuum-journal.sh']
            + ([ '--time', journald_vacuum_time ] if (journald_vacuum_time | default('') | length > 0) else [])
            + ([ '--size', journald_vacuum_size ] if (journald_vacuum_time | default('') | length == 0 and journald_vacuum_size | default('') | length > 0) else [])
          }}
      when:
        - journald_vacuum_on_deploy | bool
        - not (journald_conf_deploy is defined and journald_conf_deploy is changed)
      changed_when: true
      tags:
        - os_upgrade
        - journald_vacuum

    - name: OS upgrade deployment summary
      ansible.builtin.debug:
        msg:
          - "Scripts: {{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh"
          - "Logs: {{ os_upgrade_log_file }}"
          - "Releasever: {{ os_upgrade_releasever }} (auto = latest AL2023 release at run time)"
          - "Cron enabled: {{ os_upgrade_enable_cron | bool }}"
          - "Schedule: {{ os_upgrade_cron_schedule }} ({{ os_upgrade_cron_tz }})"
          - "Flow: stop nginx + php-fpm -> dnf upgrade -> dnf clean all -> reboot -> @reboot + 5m timer open http/https"
          - "DNF cache: dnf clean all on playbook deploy + each cron run (every 3 days)"
          - "Swap: ensured 1G /swapfile when missing (zram-only hosts need this for dnf; persisted in fstab)"
          - "Firewalld boot cron: {{ firewalld_boot_fix_enable_cron | bool }} (delay {{ firewalld_boot_fix_delay }}s) + ensure-web-ports.timer"
          - "Firewalld boot log: {{ firewalld_boot_fix_log_file }}"
          - "Journal limits: {{ journald_limit_enable | bool }} (SystemMaxUse={{ journald_system_max_use }}, vacuum on deploy={{ journald_vacuum_on_deploy | bool }})"
          - "DNF cache clean on deploy: {{ os_upgrade_clean_dnf_cache | bool }}"

  handlers:
    - name: Restart systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
        daemon_reload: true

    - name: Vacuum systemd journal
      ansible.builtin.command:
        argv: "{{ journald_vacuum_cmd }}"
      vars:
        journald_vacuum_cmd: >-
          {{
            [os_upgrade_install_dir ~ '/vacuum-journal.sh']
            + ([ '--time', journald_vacuum_time ] if (journald_vacuum_time | default('') | length > 0) else [])
            + ([ '--size', journald_vacuum_size ] if (journald_vacuum_time | default('') | length == 0 and journald_vacuum_size | default('') | length > 0) else [])
          }}
      when: journald_vacuum_on_deploy | bool
      listen: Restart systemd-journald
      changed_when: true
