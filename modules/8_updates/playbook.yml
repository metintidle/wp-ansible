---
# Deploy WordPress auto-update scripts + optional OS upgrade cron (AL2023).
#
# WordPress (ec2-user):
#   ansible-playbook -i inventory/ohara-hotels.ini modules/8_updates/playbook.yml
#   ansible-playbook -i inventory/ohara-hotels.ini modules/8_updates/playbook.yml -e wp_auto_update_enable_cron=true
#   ansible-playbook -i inventory/ohara-hotels.ini modules/8_updates/playbook.yml -e wp_auto_update_run_dry_run=true --limit station
#
# OS upgrade (root; stop nginx/php-fpm, dnf upgrade, restart):
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook.yml --tags os_upgrade
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook.yml --tags os_upgrade -e os_upgrade_enable_cron=true --limit cccls
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook.yml --tags os_upgrade -e os_upgrade_remove_cron=true
#
- name: Deploy WordPress auto-update tools
  hosts: all
  become: false
  vars:
    wp_auto_update_install_dir: /home/ec2-user/bin
    wp_auto_update_log_dir: /home/ec2-user/logs
    wp_auto_update_backup_dir: /home/ec2-user/backups/wp-auto-update
    wp_auto_update_backup_retention: 28
    wp_auto_update_backup: "1"
    wp_auto_update_env_file: /home/ec2-user/.wp-auto-update.env
    wp_cli_path: /usr/local/bin/wp
    wp_auto_update_enable_cron: false
    wp_auto_update_remove_cron: false
    wp_auto_update_cron_tz: Australia/Sydney
    wp_auto_update_cron_schedule: "0 3 * * 0"
    wp_auto_update_plugins: "1"
    wp_auto_update_themes: "0"
    wp_auto_update_core_minor_only: "0"
    wp_auto_update_plugin_exclude: "elementor-pro,elementor"
    wp_auto_update_elementor_minor: "1"
  tags:
    - updates
    - wp_updates

  tasks:
    - name: Stat candidate WordPress config paths
      ansible.builtin.stat:
        path: "{{ item }}"
      register: wp_auto_update_wp_config_stats
      loop:
        - /home/ec2-user/html/wp-config.php
        - /usr/share/nginx/html/wp-config.php
        - /var/www/html/wp-config.php

    - name: Set wp_auto_update_wp_root from inventory wp_root
      ansible.builtin.set_fact:
        wp_auto_update_wp_root: "{{ wp_root }}"
      when: wp_root is defined and (wp_root | default('') | length) > 0

    - name: Set wp_auto_update_wp_root from first existing wp-config.php
      ansible.builtin.set_fact:
        wp_auto_update_wp_root: "{{ (wp_auto_update_wp_config_stats.results | selectattr('stat.exists') | map(attribute='item') | list | first) | dirname }}"
      when: wp_auto_update_wp_root is not defined

    - name: Fail when no WordPress root found
      ansible.builtin.fail:
        msg: >-
          No wp-config.php found. Set wp_root in inventory or install WordPress first.
      when: wp_auto_update_wp_root is not defined or (wp_auto_update_wp_root | length) == 0

    - name: Require WordPress install
      ansible.builtin.stat:
        path: "{{ wp_auto_update_wp_root }}/wp-config.php"
      register: wp_auto_update_config
      failed_when: not wp_auto_update_config.stat.exists

    - name: Require WP-CLI
      ansible.builtin.stat:
        path: "{{ wp_cli_path }}"
      register: wp_auto_update_wp_cli
      failed_when: not wp_auto_update_wp_cli.stat.exists

    - name: Create update directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ wp_auto_update_install_dir }}"
        - "{{ wp_auto_update_log_dir }}"
        - "{{ wp_auto_update_backup_dir }}"

    - name: Verify wp auto-update backup dir outside webroot
      ansible.builtin.assert:
        that:
          - not wp_auto_update_backup_dir.startswith(wp_auto_update_wp_root)
          - "'wp-content' not in wp_auto_update_backup_dir"
        fail_msg: >-
          wp_auto_update_backup_dir must be outside WordPress webroot
          ({{ wp_auto_update_wp_root }}). Current: {{ wp_auto_update_backup_dir }}

    - name: Deploy update shell scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ wp_auto_update_install_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - run-wp-auto-update.sh
        - install-wp-auto-update-cron.sh

    - name: Strip CRLF from WordPress update scripts
      ansible.builtin.command:
        cmd: "sed -i 's/\\r$//' {{ wp_auto_update_install_dir }}/{{ item }}"
      loop:
        - run-wp-auto-update.sh
        - install-wp-auto-update-cron.sh
      changed_when: false

    - name: Write optional wp-auto-update env file
      ansible.builtin.copy:
        dest: "{{ wp_auto_update_env_file }}"
        mode: "0600"
        content: |
          WP_AUTO_UPDATE_PLUGINS={{ wp_auto_update_plugins }}
          WP_AUTO_UPDATE_THEMES={{ wp_auto_update_themes }}
          WP_AUTO_UPDATE_CORE_MINOR_ONLY={{ wp_auto_update_core_minor_only }}
          WP_AUTO_UPDATE_PLUGIN_EXCLUDE={{ wp_auto_update_plugin_exclude }}
          WP_AUTO_UPDATE_ELEMENTOR_MINOR={{ wp_auto_update_elementor_minor }}
          WP_AUTO_UPDATE_BACKUP={{ wp_auto_update_backup }}
          WP_AUTO_UPDATE_BACKUP_DIR={{ wp_auto_update_backup_dir }}
          WP_AUTO_UPDATE_BACKUP_RETENTION={{ wp_auto_update_backup_retention }}
          WP_AUTO_UPDATE_LOG_DIR={{ wp_auto_update_log_dir }}
      when: wp_auto_update_write_env_file | default(true) | bool

    - name: Remove wp auto-update cron
      ansible.builtin.command:
        cmd: "{{ wp_auto_update_install_dir }}/install-wp-auto-update-cron.sh --remove"
      when: wp_auto_update_remove_cron | bool
      changed_when: true

    - name: Install wp auto-update cron (03:00 Sunday, Australia/Sydney)
      ansible.builtin.command:
        cmd: >-
          {{ wp_auto_update_install_dir }}/install-wp-auto-update-cron.sh
          --tz {{ wp_auto_update_cron_tz }}
          --schedule "{{ wp_auto_update_cron_schedule }}"
          --wrapper {{ wp_auto_update_install_dir }}/run-wp-auto-update.sh
      when:
        - wp_auto_update_enable_cron | bool
        - not (wp_auto_update_remove_cron | bool)
      changed_when: true

    - name: Run update dry-run (check only)
      ansible.builtin.command:
        cmd: "{{ wp_auto_update_install_dir }}/run-wp-auto-update.sh"
      environment:
        WP_AUTO_UPDATE_DRY_RUN: "1"
      register: wp_auto_update_dry_run
      changed_when: false
      when: wp_auto_update_run_dry_run | default(false) | bool

    - name: Show dry-run output
      ansible.builtin.debug:
        msg: "{{ wp_auto_update_dry_run.stdout_lines }}"
      when:
        - wp_auto_update_run_dry_run | default(false) | bool
        - wp_auto_update_dry_run is defined

    - name: WordPress deployment summary
      ansible.builtin.debug:
        msg:
          - "Scripts: {{ wp_auto_update_install_dir }}/"
          - "Logs: {{ wp_auto_update_log_dir }}/wp-auto-update.log"
          - "DB backups: {{ wp_auto_update_backup_dir }}/ (outside webroot, keep {{ wp_auto_update_backup_retention }} days)"
          - "WordPress root: {{ wp_auto_update_wp_root }}"
          - "Cron enabled: {{ wp_auto_update_enable_cron | bool }}"
          - "Schedule: {{ wp_auto_update_cron_schedule }} ({{ wp_auto_update_cron_tz }})"
          - "Dry-run: WP_AUTO_UPDATE_DRY_RUN=1 {{ wp_auto_update_install_dir }}/run-wp-auto-update.sh"

- name: Deploy OS auto-upgrade tools (Amazon Linux 2023)
  hosts: all
  become: true
  gather_facts: true
  vars:
    os_upgrade_install_dir: /usr/local/bin
    os_upgrade_log_file: /var/log/os-upgrade.log
    os_upgrade_enable_cron: false
    os_upgrade_remove_cron: false
    os_upgrade_cron_tz: Australia/Sydney
    os_upgrade_cron_schedule: "0 0 */3 * *"
    os_upgrade_releasever: "auto"
  tags:
    - updates
    - os_upgrade

  tasks:
    - name: Skip OS upgrade on non-Amazon Linux 2023 hosts
      ansible.builtin.meta: end_host
      when: >
        ansible_distribution != "Amazon"
        or ansible_distribution_major_version | string != "2023"

    - name: Require dnf
      ansible.builtin.command:
        cmd: which dnf
      register: os_upgrade_dnf_check
      changed_when: false

    - name: Deploy OS upgrade shell scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "{{ os_upgrade_install_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh

    - name: Strip CRLF from OS upgrade scripts
      ansible.builtin.command:
        cmd: "sed -i 's/\\r$//' {{ os_upgrade_install_dir }}/{{ item }}"
      loop:
        - os-upgrade-with-webstack-restart.sh
        - install-os-upgrade-cron.sh
      changed_when: false

    - name: Ensure OS upgrade log file
      ansible.builtin.file:
        path: "{{ os_upgrade_log_file }}"
        state: touch
        mode: "0644"

    - name: Remove OS upgrade cron
      ansible.builtin.command:
        cmd: "{{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh --remove"
      when: os_upgrade_remove_cron | bool
      changed_when: true

    - name: Install OS upgrade cron (midnight every 3 days, Australia/Sydney)
      ansible.builtin.command:
        cmd: >-
          {{ os_upgrade_install_dir }}/install-os-upgrade-cron.sh
          --tz {{ os_upgrade_cron_tz }}
          --schedule "{{ os_upgrade_cron_schedule }}"
          --releasever {{ os_upgrade_releasever }}
          --wrapper {{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh
      when:
        - os_upgrade_enable_cron | bool
        - not (os_upgrade_remove_cron | bool)
      changed_when: true

    - name: OS upgrade deployment summary
      ansible.builtin.debug:
        msg:
          - "Scripts: {{ os_upgrade_install_dir }}/os-upgrade-with-webstack-restart.sh"
          - "Logs: {{ os_upgrade_log_file }}"
          - "Releasever: {{ os_upgrade_releasever }} (auto = latest AL2023 release at run time)"
          - "Cron enabled: {{ os_upgrade_enable_cron | bool }}"
          - "Schedule: {{ os_upgrade_cron_schedule }} ({{ os_upgrade_cron_tz }})"
          - "Flow: stop nginx + php-fpm -> dnf upgrade -> restart php-fpm + nginx"
