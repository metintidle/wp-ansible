---
# Combined entry point: OS + WordPress auto-update playbooks.
# Prefer playbook-os.yml or playbook-wp.yml when deploying one stack only.
#
#   ansible-playbook -i inventory/ohara-hotels.ini modules/8_updates/playbook.yml --tags wp_updates
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/8_updates/playbook.yml --tags os_upgrade
#
- name: Import OS auto-upgrade playbook
  ansible.builtin.import_playbook: playbook-os.yml

- name: Import WordPress auto-update playbook
  ansible.builtin.import_playbook: playbook-wp.yml
