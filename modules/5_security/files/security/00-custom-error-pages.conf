# Custom branded error page for security-rule blocks (deny all; return 403;).
# Served from a fixed path independent of each vhost's document root, so one
# copy covers every site. Deploy to: /etc/nginx/default.d/
#
# Fail2Ban / firewall-level bans are a separate layer (iptables DROP) and
# cannot show any page — this only covers 403s generated inside Nginx.

error_page 403 /403-security-block.html;

location = /403-security-block.html {
  internal;
  root /usr/share/nginx/error-pages;
  default_type text/html;
}
