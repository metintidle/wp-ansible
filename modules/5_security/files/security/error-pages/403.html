<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>403 &mdash; Access Denied</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #161a22;
    --border: #262c38;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #e2483d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #e2e5eb;
      --text: #1b1f27;
      --muted: #666f80;
      --accent: #d13a2f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 36px;
    text-align: center;
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    color: var(--accent);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .code {
    display: inline-block;
    margin-top: 18px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 4 5.5V11c0 5.5 3.4 9.7 8 11 4.6-1.3 8-5.5 8-11V5.5L12 2Z"/>
      <path d="M9.5 12.2 11.3 14l3.2-3.4"/>
    </svg>
    <h1>Access to this resource is restricted</h1>
    <p>The request was blocked by this site's security rules.</p>
    <p>If you believe this is a mistake, please contact the site administrator.</p>
    <div class="code">403 Forbidden</div>
  </div>
</body>
</html>
