# Local override for stock nginx-bad-request filter.
# Brizy editor traffic (heartbeat, saves, font loads) can return HTTP 400 during
# editing or version mismatches; without this, nginx-bad-request bans editors
# after maxretry 400s (see tongarrafamilypractice 2026-09-10).
[Definition]
ignoreregex = ^<HOST> - .*"(GET|POST|HEAD) [^"]*brizy[^"]*" 400
              ^<HOST> - .*"(GET|POST|HEAD) [^"]*in-front-editor[^"]*" 400
