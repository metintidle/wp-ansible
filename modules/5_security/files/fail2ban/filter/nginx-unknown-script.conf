[Definition]
failregex = ^.*Primary script unknown.*client: <HOST>.*$
            ^.*access forbidden by rule.*client: <HOST>.*$
ignoreregex = request: "[A-Z]+ /(wp-admin|wp-login\.php|wp-json|wp-content|wp-includes)
              referrer: "https?://[^"]*/(wp-admin|wp-login\.php)
              request: "[A-Z]+ /\.well-known/

# Explanation of regex:
# 1. Primary script unknown errors (real missing-script probes)
# 2. Access forbidden errors
# "No such file or directory" (FPM socket down) intentionally NOT matched:
#   it fires for every concurrent user during a PHP-FPM outage, not just
#   attackers (see docs/ohara/north-nowra.md — 95.82.0.218 false ban).
# ignoreregex exempts:
#   - wp-admin/login/REST context so editors are never banned on this jail;
#   - /.well-known/ (RFC 8615): legit crawlers (Google traffic-advice, Facebook
#     ucp, security.txt) and — critically — Let's Encrypt acme-challenge hit a
#     403 "access forbidden by rule" here; banning them breaks SSL renewal/SEO.
#     (NB: nginx should also be fixed to allow /.well-known/ instead of 403.)