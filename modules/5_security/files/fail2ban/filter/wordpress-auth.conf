# Fail2Ban filter for WordPress authentication events emitted by the IT&T
# wp-fail2ban-auth mu-plugin (plugins/wp-fail2ban-auth.php).
#
# Source: PHP syslog(), ident "wp-fail2ban", facility authpriv -> journald.
# Intended jail: backend=systemd, journalmatch SYSLOG_IDENTIFIER=wp-fail2ban
# (so only this plugin's messages are fed here). The failregex is left
# unanchored so it also works if the events are ever read from a syslog FILE
# (which carries a "date host wp-fail2ban[pid]:" prefix) rather than journald.
#
# Only FAILURE events are matched. Successful logins are logged at LOG_INFO as
# "accepted authentication ..." and are deliberately NOT matched here, so a real
# editor logging in is never banned. The username is captured with [^']* (the
# plugin strips quotes/newlines), so a crafted username cannot forge the <HOST>.
[Definition]
failregex = authentication failure for '[^']*' from <HOST>$
            blocked user enumeration attempt from <HOST>$
ignoreregex =
