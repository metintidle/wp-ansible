# Bans only on the security_login rate-limit zone (wp-login brute force).
# Bursts on zone=one (global) or zone=security_api (admin-ajax/Elementor) are
# nginx-throttled (503) but never banned here — editors are on dynamic/home
# IPs and can't be ignoreip-whitelisted. See fail2ban-logged-in-users.md.
[Definition]
failregex = ^.*\[error\] \d+#\d+: \*\d+ limiting requests, excess: [\d\.]+ by zone "security_login",\s*client: <HOST>,
ignoreregex =
# nginx error-log timestamp is at line start; mirrors stock nginx-limit-req.conf
datepattern = {^LN-BEG}
