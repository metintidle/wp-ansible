# 2. Filter configuration - non-wordpress-requests-filter.conf (in filter.d directory)
[Definition]
# IMPORTANT: This approach focuses on detecting malicious patterns instead of trying to
# whitelist all legitimate URLs, which is nearly impossible with WordPress pretty URLs.
# We'll only match requests that result in error codes AND contain suspicious patterns.

# This matches common attack patterns rather than trying to whitelist all WordPress paths
failregex = ^<HOST> -.*"(GET|POST|HEAD) .*(\.env|\.git|\.svn|\.htaccess|cgi-bin|wp-config\.php|config\.php|xmlrpc\.php|shell|admin\.php|\.sql|\.zip|wp-config\.bak|wp-config\.old|backup|db-?dump|database|db\.sql|\.bak|\.tar\.gz|\.tar|\.7z).*" (404|403|400) .*$
            ^<HOST> -.*"(GET|POST) .*(\.php\?).*(\=SELECT|\=UNION|\=CONCAT|\=\.\./|\=\\x|%%0|script\>|\<script)" .*$
            ^<HOST> -.*".*(passwd|setup|install|hack|shell|backdoor)\.php.*" (404|403|400) .*$
            ^<HOST> -.*"(GET|POST) /xmlrpc\.php.*" .*$
            ^<HOST> -.*"(POST) /wp-login\.php[^"]*" (404|403|401) .*$
            ^<HOST> -.*"[A-Z]+ [^"]*(/_ignition/|/actuator|/owa/|/ecp/|/AutoDiscover/|autodiscover\.xml|/\+CSCOE\+/|/\+webvpn|/epa/scripts|nsepa_setup|alfacgiapi|ALFA_DATA|/___proxy_subdomain|/whostmgr|/boaform|/HNAP1|/hnap|/dns-query|/magento_version|/\.aws/|/\.ssh/|/id_rsa|/\.npmrc|/\.dockercfg|/\.git-credentials|eval-stdin\.php|/vendor/phpunit|master\.key|service-account\.json|terraform\.tfstate|/settings\.py|/secrets?\.(py|json|ya?ml|txt)|logon\.aspx|login\.jsp|login\.action)[^"]*" .*$
            ^<HOST> -.*"[A-Z]+ [^"]*/wp-admin/(install|setup-config)\.php[^"]*" .*$

# Exempt WordPress admin/REST/content paths at any status (path-based, unspoofable).
# Exclusions from the exemption (so real attacks under these paths are still caught):
#  - wp-login.php: keeps the "(POST) /wp-login.php (404|403|401)" brute-force line live.
#  - /wp-admin/install.php & /setup-config.php: WP install-hijack probes; an editor
#    never hits these on a running site (real editor admin traffic is 200/302).
# wp-content/wp-includes stay fully exempt: legit plugins named *backup*/*database*
# would otherwise trip the failregex tokens on a missing-asset 404.
ignoreregex = ^<HOST> -.*"(GET|POST|HEAD) /(wp-admin(?!/(install|setup-config)\.php)|wp-content|wp-includes|admin-ajax\.php|admin-post\.php|async-upload\.php|index\.php|wp-cron\.php|wp-json|favicon\.ico|robots\.txt).*"
