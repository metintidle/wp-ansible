[Definition]
failregex = ^<HOST> - .* "(GET|POST|HEAD) .*\.php.*" 404 .*$
            ^<HOST> - .* "(GET|POST|HEAD) .*shell.*\.php.*" .*$
# wp-login.php intentionally NOT exempted: this failregex only fires on 404, and
# editors authenticate with 200/302 — only scanners 404 on /wp-login.php (447/447
# such lines on bateys were bots). Exempting it only shielded brute-forcers.
ignoreregex = ^<HOST> -.*"(GET|POST|HEAD) /(wp-admin|wp-json|admin-ajax\.php|async-upload\.php).*"
