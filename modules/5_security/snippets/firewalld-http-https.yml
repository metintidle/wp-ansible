---
# After AL2023 dnf upgrades, firewalld may be installed/re-enabled with only ssh open.
# Fail2ban hosts use iptables instead — disable firewalld when fail2ban is active.
- name: Check whether fail2ban is active
  ansible.builtin.command:
    cmd: systemctl is-active fail2ban
  register: firewall_fail2ban_active
  changed_when: false
  failed_when: false

- name: Stop and disable firewalld when fail2ban manages iptables
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  when: firewall_fail2ban_active.stdout == "active"

- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present
  when: firewall_fail2ban_active.stdout != "active"

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: firewall_fail2ban_active.stdout != "active"

- name: Open SSH on firewalld
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true
  when:
    - firewall_fail2ban_active.stdout != "active"
    - firewall_open_ssh | default(true) | bool

- name: Open HTTP on firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when: firewall_fail2ban_active.stdout != "active"

- name: Open HTTPS on firewalld
  ansible.posix.firewalld:
    service: https
    permanent: true
    state: enabled
    immediate: true
  when: firewall_fail2ban_active.stdout != "active"

- name: Firewalld post-upgrade summary
  ansible.builtin.debug:
    msg:
      - >-
        fail2ban active: {{ firewall_fail2ban_active.stdout == 'active' }} —
        {{ 'firewalld disabled (iptables/fail2ban in use)' if firewall_fail2ban_active.stdout == 'active'
           else 'firewalld enabled with services: ' ~ ('ssh, ' if firewall_open_ssh | default(true) | bool else '') ~ 'http, https' }}
      - "Verify firewalld: firewall-cmd --list-services"
      - "Verify iptables: iptables -L INPUT -n"
