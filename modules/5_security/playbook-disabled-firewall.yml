---
# Open HTTP/HTTPS on firewalld after AL2023 dnf upgrades install or re-enable it.
#
# Amazon Linux 2023 updates can pull in firewalld with a default-deny posture that
# blocks Nginx on 80/443 until these services are allowed.
#
# Fail2Ban hosts in this repo normally disable firewalld in favour of iptables
# (see playbook-fail2ban.yml). When fail2ban is active here, firewalld is stopped
# instead of configured, so iptables bans keep working.
#
# Usage:
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/5_security/playbook-disabled-firewall.yml
#   ansible-playbook -i inventory/ohara-hotels.ini modules/5_security/playbook-disabled-firewall.yml --limit cccls
#
- name: Open HTTP and HTTPS on firewalld (Amazon Linux 2023)
  hosts: all
  become: true
  gather_facts: true
  collections:
    - ansible.posix
  vars:
    firewall_open_ssh: true

  tasks:
    - name: Skip non-Amazon Linux 2023 hosts
      ansible.builtin.meta: end_host
      when: >
        ansible_distribution != "Amazon"
        or ansible_distribution_major_version | string != "2023"

    - name: Fix firewalld after OS upgrades
      ansible.builtin.import_tasks: snippets/firewalld-http-https.yml
