---
# Open HTTP/HTTPS on firewalld after AL2023 dnf upgrades install or re-enable it.
#
# Amazon Linux 2023 updates can pull in firewalld with a default-deny posture that
# blocks Nginx on 80/443 until these services are allowed.
#
# Fail2Ban hosts in this repo normally disable firewalld in favour of iptables
# (see playbook-fail2ban.yml). When fail2ban is active here, firewalld is stopped
# instead of configured, so iptables bans keep working.
#
# Usage:
#   ansible-playbook -i inventory/al2023-fail2ban.ini modules/5_security/playbook-disabled-firewall.yml
#   ansible-playbook -i inventory/ohara-hotels.ini modules/5_security/playbook-disabled-firewall.yml --limit cccls
#
- name: Open HTTP and HTTPS on firewalld (Amazon Linux 2023)
  hosts: all
  become: true
  gather_facts: true
  collections:
    - ansible.posix
  vars:
    firewall_open_ssh: true

  tasks:
    - name: Skip non-Amazon Linux 2023 hosts
      ansible.builtin.meta: end_host
      when: >
        ansible_distribution != "Amazon"
        or ansible_distribution_major_version | string != "2023"

    - name: Check whether fail2ban is active
      ansible.builtin.command:
        cmd: systemctl is-active fail2ban
      register: firewall_fail2ban_active
      changed_when: false
      failed_when: false

    - name: Stop and disable firewalld when fail2ban manages iptables
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      when: firewall_fail2ban_active.stdout == "active"

    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present
      when: firewall_fail2ban_active.stdout != "active"

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when: firewall_fail2ban_active.stdout != "active"

    - name: Open SSH on firewalld
      ansible.posix.firewalld:
        service: ssh
        permanent: true
        state: enabled
        immediate: true
      when:
        - firewall_fail2ban_active.stdout != "active"
        - firewall_open_ssh | bool

    - name: Open HTTP on firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
      when: firewall_fail2ban_active.stdout != "active"

    - name: Open HTTPS on firewalld
      ansible.posix.firewalld:
        service: https
        permanent: true
        state: enabled
        immediate: true
      when: firewall_fail2ban_active.stdout != "active"

    - name: Firewall fix summary
      ansible.builtin.debug:
        msg:
          - >-
            fail2ban active: {{ firewall_fail2ban_active.stdout == 'active' }} —
            {{ 'firewalld disabled (iptables/fail2ban in use)' if firewall_fail2ban_active.stdout == 'active'
               else 'firewalld enabled with services: ' ~ ('ssh, ' if firewall_open_ssh | bool else '') ~ 'http, https' }}
          - "Verify firewalld: firewall-cmd --list-services"
          - "Verify iptables: iptables -L INPUT -n"
